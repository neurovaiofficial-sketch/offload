# Builds Offload-Setup.exe (Windows 11 x64), Offload.dmg (Apple Silicon) and the pairing
# service image, and runs the Offload unit tests.
#
# Configure once in the repository settings (Settings > Secrets and variables > Actions):
#   variable OFFLOAD_RENDEZVOUS_SERVER  public host of your Offload server, e.g. offload.example.com
#   secret   OFFLOAD_RS_PUB_KEY         contents of the server's data/id_ed25519.pub
# Optional, for trusted installers:
#   secrets  WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORD          Authenticode certificate (.pfx)
#   secrets  MACOS_P12_BASE64, MACOS_P12_PASSWORD,
#            MACOS_CODESIGN_IDENTITY, MACOS_NOTARIZE_JSON      Developer ID + notarization API key
# Without them the installers are built unsigned (macOS: ad-hoc signed) and say so.

name: Offload build

on:
  workflow_dispatch:
  push:
    branches: [offload, main]
    tags: ["offload-v*"]
  pull_request:

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  OFFLOAD_RENDEZVOUS_SERVER: ${{ vars.OFFLOAD_RENDEZVOUS_SERVER }}
  OFFLOAD_RS_PUB_KEY: ${{ secrets.OFFLOAD_RS_PUB_KEY }}

permissions:
  contents: read

jobs:
  test-core:
    name: Offload unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.81"
      - name: offload_core
        working-directory: libs/offload_core
        run: cargo test
      - name: pairing service
        working-directory: offload-server/pairing
        run: cargo test --locked
      - name: server scripts
        run: bash -n offload-server/deploy.sh offload-server/check.sh offload-server/build-pairing-context.sh

  config-check:
    name: Server configuration
    runs-on: ubuntu-22.04
    steps:
      - name: Report what these builds connect to
        run: |
          if [ -z "$OFFLOAD_RENDEZVOUS_SERVER" ] || [ -z "$OFFLOAD_RS_PUB_KEY" ]; then
            echo "::warning::OFFLOAD_RENDEZVOUS_SERVER / OFFLOAD_RS_PUB_KEY are not set. These builds only work against a server on the same machine (development builds)."
          else
            echo "Builds will connect to $OFFLOAD_RENDEZVOUS_SERVER"
            echo "$OFFLOAD_RS_PUB_KEY" | base64 -d | wc -c | grep -qx 32 || { echo "::error::OFFLOAD_RS_PUB_KEY is not a base64 Ed25519 public key"; exit 1; }
          fi

  pairing-image:
    name: Pairing service image
    needs: test-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash offload-server/build-pairing-context.sh
      - run: docker build -t offload-pairing:ci offload-server/pairing

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  windows:
    name: Windows x64 (Offload-Setup.exe)
    needs: [generate-bridge, test-core, config-check]
    runs-on: windows-2022
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Point the About page at this source repository
        shell: bash
        run: |
          sed -i "s|defaultValue: 'https://github.com/rustdesk/rustdesk'|defaultValue: '${{ github.server_url }}/${{ github.repository }}'|" flutter/lib/desktop/pages/offload_settings_page.dart

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk's patched Flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: offload-windows

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Build Offload
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./Offload
          Copy-Item LICENCE ./Offload/LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md ./Offload/THIRD_PARTY_NOTICES.md

      - name: Find Runner.res
        shell: bash
        continue-on-error: true
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          [ -n "$runner_res" ] && cp "$runner_res" ./libs/portable/Runner.res

      - name: Sign application files
        if: env.WINDOWS_PFX_BASE64 != ''
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\offload.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem ./Offload -Recurse -Include *.exe,*.dll | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\offload.pfx" /p $env:WINDOWS_PFX_PASSWORD $_.FullName
          }

      - name: Build Offload-Setup.exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Offload/ -o . -e ../../Offload/Offload.exe
          popd
          mkdir -p dist
          mv ./target/release/rustdesk-portable-packer.exe ./dist/Offload-Setup.exe

      - name: Sign Offload-Setup.exe
        if: env.WINDOWS_PFX_BASE64 != ''
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\offload.pfx" /p $env:WINDOWS_PFX_PASSWORD ./dist/Offload-Setup.exe
          Remove-Item "$env:RUNNER_TEMP\offload.pfx"

      - name: Record signing state
        shell: bash
        run: |
          if [ -z "$WINDOWS_PFX_BASE64" ]; then echo "UNSIGNED: Windows will show a SmartScreen warning." > dist/SIGNING-windows.txt; else echo "Authenticode signed" > dist/SIGNING-windows.txt; fi
          sha256sum dist/Offload-Setup.exe | tee dist/Offload-Setup.exe.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Offload-Setup-windows-x64
          path: dist/

  macos:
    name: macOS Apple Silicon (Offload.dmg)
    needs: [generate-bridge, test-core, config-check]
    runs-on: macos-14
    env:
      MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Point the About page at this source repository
        run: |
          sed -i '' "s|defaultValue: 'https://github.com/rustdesk/rustdesk'|defaultValue: '${{ github.server_url }}/${{ github.repository }}'|" flutter/lib/desktop/pages/offload_settings_page.dart

      - name: Import the codesign certificate
        if: env.MACOS_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: offload

      - name: Import notarization key
        if: env.MACOS_P12_BASE64 != ''
        uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac # v1.2
        with:
          fileName: notarize.json
          fileDir: ${{ runner.temp }}
          encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}

      - name: Install rcodesign
        if: env.MACOS_P12_BASE64 != ''
        run: |
          pushd /tmp
          wget -q https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz
          tar -zxf apple-codesign-0.22.0-macos-universal.tar.gz
          mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin
          popd

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Install NASM 2.x
        run: |
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: offload-macos

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Build Offload
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit
          APP=./flutter/build/macos/Build/Products/Release/Offload.app
          cp LICENCE "$APP/Contents/Resources/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"

      - name: Sign app (Developer ID, or ad-hoc when no certificate is configured)
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          APP=./flutter/build/macos/Build/Products/Release/Offload.app
          if [ -n "$MACOS_P12_BASE64" ]; then
            security default-keychain -s offload.keychain
            security unlock-keychain -p "$MACOS_P12_PASSWORD" offload.keychain
            bash ./.github/scripts/sign-macos-app.sh "$APP" "$MACOS_CODESIGN_IDENTITY" ./flutter/macos/Runner/Release.entitlements
          else
            bash ./.github/scripts/sign-macos-app.sh "$APP" - ./flutter/macos/Runner/Release.entitlements
          fi

      - name: Create Offload.dmg
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p dist
          create-dmg --volname "Offload" --icon "Offload.app" 200 190 --hide-extension "Offload.app" \
            --window-size 800 400 --app-drop-link 600 185 dist/Offload.dmg \
            ./flutter/build/macos/Build/Products/Release/Offload.app
          if [ -n "$MACOS_P12_BASE64" ]; then
            codesign --force --options runtime -s "$MACOS_CODESIGN_IDENTITY" --timestamp dist/Offload.dmg
            rcodesign notary-submit --api-key-path "${{ runner.temp }}/notarize.json" --staple dist/Offload.dmg
            echo "Developer ID signed and notarized" > dist/SIGNING-macos.txt
          else
            echo "UNSIGNED (ad-hoc): macOS will block the first launch; see docs/INSTALL.md." > dist/SIGNING-macos.txt
          fi
          shasum -a 256 dist/Offload.dmg | tee dist/Offload.dmg.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Offload-macos-arm64
          path: dist/

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/offload-v')
    needs: [windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          files: |
            dist/Offload-Setup.exe
            dist/Offload-Setup.exe.sha256
            dist/Offload.dmg
            dist/Offload.dmg.sha256
            dist/SIGNING-*.txt
